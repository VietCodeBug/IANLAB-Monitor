name: Build and publish Windows preview

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build portable win-x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64
        shell: pwsh
        run: ./build-windows.ps1
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $file = 'dist/IANLAB-Monitor-win-x64.zip'
          if (!(Test-Path $file)) { throw 'ZIP missing - build did not create package' }
          (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() + '  IANLAB-Monitor-win-x64.zip' | Set-Content -Encoding ascii 'dist/IANLAB-Monitor-win-x64.zip.sha256'
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IANLAB-Monitor-win-x64
          path: |
            dist/IANLAB-Monitor-win-x64.zip
            dist/IANLAB-Monitor-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish preview Release on main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-main
          target_commitish: ${{ github.sha }}
          name: IANLAB Monitor — latest Windows preview
          body: |
            Experimental Windows x64 portable build from main.
            Extract the entire ZIP and run IANLAB.Monitor.exe.
            Note: CPU/GPU fan RPM and battery voltage depend on firmware sensor availability.
            This is not a fan-control or BIOS-modification tool.
          prerelease: true
          make_latest: false
          files: |
            dist/IANLAB-Monitor-win-x64.zip
            dist/IANLAB-Monitor-win-x64.zip.sha256
      - name: Publish versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/IANLAB-Monitor-win-x64.zip
            dist/IANLAB-Monitor-win-x64.zip.sha256
